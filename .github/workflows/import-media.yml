name: Import existing demo videos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-media.yml
      - media-migration.json
      - scripts/import-media.py

permissions:
  contents: write

concurrency:
  group: import-demo-videos
  cancel-in-progress: false

jobs:
  import-media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Download and verify existing public media
        run: python3 scripts/import-media.py
      - name: Save verified videos and posters in this repository
        run: |
          git add public/videos
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import all verified demo videos and posters'
          git push origin HEAD:main
